spring.application.name=Loan_Project
server.port=8080


spring.datasource.url=jdbc:mysql://localhost:3306/LoanApp?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep Java field names mapped exactly to DB column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


spring.thymeleaf.cache=false


spring.mvc.hiddenmethod.filter.enabled=true

app.rate-limit.window-seconds=60
app.rate-limit.register.max-requests=5
app.rate-limit.calculate.max-requests=10
app.rate-limit.get.max-requests=10
app.rate-limit.default.max-requests=30


spring.data.redis.host=localhost
spring.data.redis.port=6379


spring.data.redis.timeout=2s


spring.cache.type=redis

